# Paper defaults for DanceTrack.
history_size: 30
hidden_dim: 128
positional_dim: 128
attention_heads: 4
attention_layers: 2
max_group_size: 16
candidate_count: 16
group_eiou_threshold: 1.7
attention_threshold: 0.15
affinity_threshold: 0.5
neighbor_mask_probability: 0.15
trajectory_crop_probability: 0.2
identity_swap_probability: 0.1
short_term_lost: 20
gdi_motion_weight: 0.2
gdi_structure_weight: 0.5
gdi_temporal_weight: 0.3
temporal_horizon_frames: 90
termination_threshold: 0.68
termination_patience: 3
epochs: 150
